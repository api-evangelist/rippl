name: Rippl
description: >-
  Rippl (Rippl Care, now part of Harbor Health) is a value-based,
  technology-enabled dementia and senior behavioral-health care provider backed
  by General Catalyst. It delivers specialized dementia care including medication
  assessments, personalized care plans, counseling, community-resource
  connections, care-navigation check-ins, safety guidance, and caregiver
  support, partnering with health systems and payors to lower total cost of care
  and improve outcomes for older adults. Rippl operates as a clinical
  care-delivery organization rather than an API-first software vendor: it
  publishes no public developer API, SDK, or documentation surface, and its
  patient portal is provided through an athenahealth integration.
